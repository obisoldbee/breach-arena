<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BREACH — 打破掩体，改变战局。</title><link rel="stylesheet" href="style.css"></head><body><header><div class="brand">BREACH<span>打破掩体，改变战局。</span></div><div class="round"><small id="round">第 01 回合</small><b id="timer">03:00</b></div><button id="sound" class="small">音效：开</button><button id="menu" class="small">大厅</button></header><main><section class="stage"><canvas id="game" aria-label="Top-down shooter arena"></canvas><div id="welcome"><div class="welcome-inner"><h1>打破掩体。<br>打出你的路。</h1><p>每一面碎裂的墙，都改变战场。<br>叫上朋友，靠近彼此就能语音交流。</p><button id="quick-practice">开始练习 <span>↗</span></button><small>单人热身 · 对手为机器人</small></div></div><div id="round-overlay" hidden></div><div id="feed" aria-live="polite"></div><div id="respawn" hidden></div><div id="mobile-controls"><div id="move-stick" class="stick"><i></i></div><button id="mobile-dash">冲刺</button><button id="mobile-talk">说话</button><div id="aim-stick" class="stick aim"><i></i></div></div><footer><div class="vitals"><span class="hp">＋ <b id="health">100</b></span><span class="ammo"><b id="ammo">24</b><small>/ 24</small></span><span id="dash-status">冲刺就绪</span></div><div class="keys"><span><kbd>WASD</kbd> 移动</span><span>鼠标瞄准 / 射击</span><span><kbd>R</kbd> 换弹</span><span><kbd>SPACE</kbd> 冲刺</span></div></footer></section><aside id="lobby"><section><div class="section-title">联机对战 <span>2–6 人</span></div><label for="name">你的昵称</label><input id="name" maxlength="16" placeholder="输入昵称…" value="新兵"><button id="create">创建房间 <span>+</span></button><div class="divider">或</div><label for="code">房间码</label><input id="code" maxlength="16" placeholder="输入房间码…" autocomplete="off"><button id="join" class="secondary">加入房间 <span>↗</span></button><p id="network-status" role="status">创建房间后，把房间码发给朋友。</p></section><section id="room-panel" hidden><div class="section-title">当前房间</div><button id="copy-code" class="room-code" title="复制房间码">—</button><div id="players"></div><button id="leave" class="secondary">退出房间</button></section><section><div class="section-title">先热热身</div><button id="practice" class="secondary">单人练习 <span>↗</span></button><p>与 3 个机器人熟悉地图，练习模式没有其他在线玩家。</p></section><section><div class="section-title">距离语音</div><button id="voice" class="secondary" disabled>开启麦克风</button><p id="voice-status">加入房间后开启麦克风，按住 V 说话。越近越清楚，走远后听不到。</p></section><section class="score-section"><div class="section-title">本局战绩 <span>K / D</span></div><div id="scores">进入战场后开始计分。</div></section><details class="connection-details"><summary>连接诊断</summary><pre id="connection-debug">未加入房间</pre></details><div class="arena-label">铸造厂 <span>01</span></div></aside></main><script type="module" src="main.js"></script></body></html>
